<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoSi — PSO + Boids Emergency Evacuation Simulator</title>
<style id="theme"></style>
</head>
<body>
<div id="topbar"></div>
<div class="workspace">
  <div class="sidepanel" id="sidePanel"></div>
  <div class="canvasarea"><canvas id="canvas" width="1300" height="820"></canvas></div>
</div>
<div class="statusbar"><span id="status">Ready</span><span style="flex:1"></span><span id="toolLabel">Tool: Select</span></div>
<script id="appjs">
const CSS=`
:root{--bg:#f5f7fa;--panel:#ffffff;--panel-border:#e2e8f0;--toolbar:#1e293b;--toolbar-text:#f8fafc;--accent:#3b82f6;--danger:#ef4444;--success:#10b981;--muted:#64748b;--canvas-bg:#ffffff;--wall:#64748b;--exit:#10b981;--safe:#3b82f6;--particle:#22c55e;--particle-evac:#86efac;--select:#3b82f6;--handle:#fde047;--handle-border:#b45309;}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:#0f172a;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--toolbar);color:var(--toolbar-text);height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;flex-shrink:0;z-index:50;box-shadow:0 2px 10px rgba(15,23,42,0.12)}
.modegroup{display:flex;gap:5px;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:4px}
.modebtn{background:transparent;border:1px solid transparent;color:var(--toolbar-text);padding:5px 14px;border-radius:6px;font-size:13px;cursor:pointer}
.modebtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.modebtn:hover:not(.active){background:rgba(255,255,255,0.08)}
.topbar span.div{color:rgba(255,255,255,0.3);font-size:11px}
.toolgroup{display:flex;gap:5px}
.toolbtn{background:transparent;border:1px solid transparent;color:var(--toolbar-text);height:36px;padding:0 9px;border-radius:7px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:background .12s}
.toolbtn span{font-size:11.5px;font-weight:600}
.toolbtn.sq{width:38px;padding:0}
.toolbtn:active{transform:translateY(1px)}
.playbtn{background:var(--success);color:#fff;border:none;height:36px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s}
.playbtn:hover{background:#0d9f78}
.playbtn:active{transform:translateY(1px)}
.statsbar{display:flex;gap:16px;margin-right:4px}
.stat{display:flex;flex-direction:column;align-items:center;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:#94a3b8;line-height:1.15}
.stat b{font-size:15px;color:#f8fafc;font-weight:700;font-variant-numeric:tabular-nums}
.toolbtn.active{background:var(--accent);box-shadow:0 0 0 2px var(--accent);color:#fff}
.toolbtn:hover:not(.active){background:rgba(255,255,255,0.08)}
.topbar .spacer{flex:1}
.workspace{display:flex;flex:1;overflow:hidden}
.sidepanel{width:340px;background:var(--panel);border-left:1px solid var(--panel-border);box-shadow:0 4px 20px rgba(15,23,42,0.06);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.canvasarea{flex:1;position:relative;background:var(--canvas-bg);overflow:auto;display:flex;align-items:center;justify-content:center}
canvas{cursor:crosshair;display:block;background:var(--canvas-bg);box-shadow:inset 0 0 0 1px #eef2f7}
.section{padding:11px 14px;border-bottom:1px solid var(--panel-border)}
.section:last-child{border-bottom:none}
.section h3{margin:0 0 9px 0;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:12px;flex-shrink:0;color:#334155;width:84px}
input[type=number]{width:66px;padding:4px 7px;font-size:12px;border:1px solid var(--panel-border);border-radius:5px;background:#fff;color:#0f172a}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.18)}
button{width:100%;padding:6px 10px;font-size:12.5px;border:1px solid var(--panel-border);border-radius:6px;background:#fff;cursor:pointer;color:#0f172a}
button:hover{background:#f8fafc;border-color:#cbd5e1}
button.primary{background:var(--success);color:#fff;border-color:var(--success)}
button.primary:hover{background:#0d9f78}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
button.danger:hover{background:#dc2626}
button.secondary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.secondary:hover{background:#2563eb}
button:disabled{opacity:.55;cursor:default}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#334155;margin-bottom:6px}
.checkbox-row input{accent-color:var(--accent);width:15px;height:15px}
.selectbox{width:100%;padding:4px 7px;font-size:12px;border:1px solid var(--panel-border);border-radius:5px;background:#fff;color:#0f172a}
.small{font-size:11px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
.statusbar{height:26px;background:#e2e8f0;color:#334155;font-size:12px;padding:0 14px;display:flex;align-items:center;flex-shrink:0;border-top:1px solid var(--panel-border)}
.keynote{font-size:11px;color:var(--muted);font-style:italic;margin-top:6px;line-height:1.4}
.togglebox{border:1px solid var(--panel-border);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:#f8fafc}
.togglebox h4{margin:0 0 7px 0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
`;
document.getElementById('theme').textContent=CSS;
const TOPBAR=`<div class="topbar"><div class="modegroup"><button class="modebtn active" id="modeEdit" onclick="app.setMode('edit')">&#9998; Edit Map</button><button class="modebtn" id="modeSim" onclick="app.setMode('sim')">&#9654; Simulate</button></div><span class="div">|</span><div class="toolgroup"><button class="toolbtn active" id="toolSelect" title="Select / move / resize (1)" onclick="app.setTool('select')">&#128433;<span>Select</span></button><button class="toolbtn" id="toolWall" title="Draw wall — drag a line, hold Shift to snap axis (2)" onclick="app.setTool('wall')">&#128208;<span>Wall</span></button><button class="toolbtn" id="toolExit" title="Place exit — drag a zone (3)" onclick="app.setTool('exit')">&#128682;<span>Exit</span></button><button class="toolbtn" id="toolSafe" title="Place safe zone — drag a zone (4)" onclick="app.setTool('safe')">&#128737;<span>Safe</span></button><button class="toolbtn" id="toolParticle" title="Place particle — click canvas (5)" onclick="app.setTool('particle')">&#128330;<span>Particle</span></button><button class="toolbtn" id="toolTarget" title="Assign target — click a particle, then an exit/safe (6)" onclick="app.setTool('target')">&#127919;<span>Target</span></button><button class="toolbtn" id="toolDelete" title="Delete object (7)" onclick="app.setTool('delete')">&#128465;<span>Delete</span></button></div><span class="div">|</span><button class="playbtn" id="btnRun" title="Run / Pause (Space)" onclick="app.toggleRun()">&#9658; Run</button><button class="toolbtn sq" id="btnStep" title="Step 1 iter" onclick="app.stepSim()">&#9197;</button><button class="toolbtn sq" id="btnReset" title="Reset sim" onclick="app.resetSim()">&#8634;</button><div class="spacer"></div><div class="statsbar"><span class="stat"><b id="statParticles">0</b>particles</span><span class="stat"><b id="statIter">0</b>iters</span><span class="stat"><b id="statEvac">0</b>evacuated</span></div><span id="statusText" class="hint" style="color:#cbd5e1;">Ready</span></div>`;
document.getElementById('topbar').innerHTML=TOPBAR;

const SIDEPANEL=`<div class="section"><h3>PSO</h3><div class="row"><label>Inertia w</label><input type="number" id="psoW" step="0.1" value="0.7"></div><div class="row"><label>Cognitive c1</label><input type="number" id="psoC1" step="0.1" value="1.4"></div><div class="row"><label>Social c2</label><input type="number" id="psoC2" step="0.1" value="1.4"></div><div class="row"><label>Max velocity</label><input type="number" id="psoMaxV" step="0.5" value="10"></div><div class="row"><label>Iters / frame</label><input type="number" id="psoIters" step="1" value="2"></div><button class="primary" onclick="app.applyPso()">Apply PSO params</button></div><div class="togglebox"><h4>Boids flocking</h4><div class="checkbox-row"><input type="checkbox" id="boidsOn" checked onchange="app.applyBoids()"><label>Enable boids</label></div><div class="row"><label>Separation</label><input type="number" id="boidSep" step="0.1" value="1.6"></div><div class="row"><label>Alignment</label><input type="number" id="boidAli" step="0.1" value="0.6"></div><div class="row"><label>Cohesion</label><input type="number" id="boidCoh" step="0.1" value="0.8"></div><div class="row"><label>Neighbor radius</label><input type="number" id="boidRadius" step="10" value="70"></div><div class="checkbox-row"><input type="checkbox" id="wallAvoid" checked onchange="app.applyBoids()"><label>Avoid walls</label></div><div class="row"><label>Wall repel</label><input type="number" id="wallRepel" step="0.1" value="2.2"></div></div><div class="section"><h3>Add particles</h3><div class="row"><label>Count</label><input type="number" id="addCount" step="1" value="14"></div><button onclick="app.addParticles()">Add random particles</button></div><div class="section"><h3>Selected object</h3><div id="selKind" class="small" style="font-weight:600;">&mdash;</div><div class="row"><label>Kind</label><select class="selectbox" id="selType" onchange="app.changeSelType()"><option value="wall">Wall line</option><option value="exit">Exit zone</option><option value="safe">Safe zone</option><option value="particle">Particle</option></select></div><div class="row"><label>Target kind</label><select class="selectbox" id="selTargetKind" onchange="app.applySelTarget()"><option value="nearest">Nearest exit/safe</option><option value="exit">Specific exit</option><option value="safe">Specific safe zone</option></select></div><div class="row"><label>Target</label><select class="selectbox" id="selTargetObj"></select></div><div class="row"><label>X</label><input type="number" id="selX" step="1" onchange="app.applySelTransform()"></div><div class="row"><label>Y</label><input type="number" id="selY" step="1" onchange="app.applySelTransform()"></div><div class="row"><label>W</label><input type="number" id="selW" step="1" onchange="app.applySelSize()"></div><div class="row"><label>H</label><input type="number" id="selH" step="1" onchange="app.applySelSize()"></div><button class="danger" style="margin-top:6px;" onclick="app.deleteSelected()">Delete selected</button></div><div class="section"><h3>Map</h3><button onclick="app.saveMap()">Save map (JSON)</button><button onclick="app.loadMap()">Load map (JSON)</button><button class="secondary" onclick="app.clearMap()">Clear map</button><button class="secondary" onclick="app.demoLayout()">Demo layout</button></div><div class="keynote">Tips: <b>Wall</b> tool — click-drag to draw a wall line, hold <b>Shift</b> to snap horizontal/vertical. Drag objects to move; drag yellow handles (or wall endpoints) to reshape. Select a particle then pick its target exit/safe zone below — particles do <b>not</b> all use the same exit. Tools: keys <b>1–7</b>. Overlays: <b>V</b> velocity, <b>P</b> pbest, <b>G</b> gbest, <b>B</b> boids (neighbor links + steering). Press <b>Del</b> to delete.</div>`;
document.getElementById('sidePanel').innerHTML=SIDEPANEL;

const CANVAS_W=1300,CANVAS_H=820,MIN_RECT=16,HANDLE=7,RADIUS=7;
const state={mode:'edit',tool:'select',walls:[],exits:[],safes:[],particles:[],selected:null,drag:null,running:false,animId:null,iter:0,pso:{w:0.7,c1:1.4,c2:1.4,maxV:10,iters:2},boids:{on:true,sep:1.6,ali:0.6,coh:0.8,radius:70},wallAvoid:true,wallRepel:2.2,showVel:true,showPbest:true,showGbest:true,showBoids:true};
function rand(a,b){return Math.random()*(b-a)+a;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function rectContains(r,p){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function rectDist(r,p){const cx=Math.max(r.x,Math.min(p.x,r.x+r.w)),cy=Math.max(r.y,Math.min(p.y,r.y+r.h));return Math.hypot(p.x-cx,p.y-cy);}
function centerOf(r){return{x:r.x+r.w/2,y:r.y+r.h/2};}
function segDistToPoint(ax,ay,bx,by,px,py){const L2=(bx-ax)**2+(by-ay)**2;if(L2===0)return Math.hypot(px-ax,py-ay);let t=((px-ax)*(bx-ax)+(py-ay)*(by-ay))/L2;t=clamp(t,0,1);return Math.hypot(px-(ax+t*(bx-ax)),py-(ay+t*(by-ay)));}
function pushOutOfWalls(pos,walls,radius,iters=3){for(let k=0;k<iters;k++){let moved=false;for(const w of walls){if(w.w&&w.h){const r={x:w.x-radius,y:w.y-radius,w:w.w+2*radius,h:w.h+2*radius};if(rectContains(r,pos)){const cx=r.x+r.w/2,cy=r.y+r.h/2;const ox=Math.min(pos.x-r.x,r.x+r.w-pos.x),oy=Math.min(pos.y-r.y,r.y+r.h-pos.y);if(ox<=oy)pos.x=pos.x<cx?r.x-0.01:r.x+r.w+0.01;else pos.y=pos.y<cy?r.y-0.01:r.y+r.h+0.01;moved=true;}}else{const d=segDistToPoint(w.x1,w.y1,w.x2,w.y2,pos.x,pos.y);if(d<radius){const nx=w.x2-w.x1,ny=w.y2-w.y1,L=Math.hypot(nx,ny);const dx=-ny/L,dy=nx/L;const side=dx*(pos.x-w.x1)+dy*(pos.y-w.y1);const sign=side>=0?1:-1;pos.x+=sign*dx*(radius-d+0.5);pos.y+=sign*dy*(radius-d+0.5);moved=true;}}}if(!moved)break;}return pos;}

class Particle{
  constructor(x,y){this.pos={x,y};const a=Math.random()*Math.PI*2,s=rand(2,7);this.vel={x:Math.cos(a)*s,y:Math.sin(a)*s};this.pbest={x,y};this.pbestCost=Infinity;this.radius=RADIUS;this.targetKind='nearest';this.targetObj=null;this.evacuated=false;}
  targetRect(){if(this.targetObj)return this.targetObj;const exits=state.exits,safes=state.safes;if(exits.length===0&&safes.length===0)return null;let best=null,bd=Infinity;
    for(const e of exits){const d=dist(this.pos,centerOf(e));if(d<bd){bd=d;best=e;}}
    for(const s of safes){const d=dist(this.pos,centerOf(s));if(d<bd){bd=d;best=s;}}
    return best;}
  targetPos(){const t=this.targetRect();return t?centerOf(t):this.pos;}
  groupKey(){const t=this.targetRect();if(!t)return['none',0];if(state.exits.includes(t))return['exit',state.exits.indexOf(t)];if(state.safes.includes(t))return['safe',state.safes.indexOf(t)];return['none',0];}
  cost(){const t=this.targetPos();let c=dist(this.pos,t);for(const w of state.walls){const d=(w.w&&w.h)?rectDist(w,this.pos):segDistToPoint(w.x1,w.y1,w.x2,w.y2,this.pos.x,this.pos.y);if(d<this.radius)c+=1000+(this.radius-d)*50;}return c;}
}
function groupBests(){const groups={};for(const p of state.particles){if(p.evacuated)continue;const k=p.groupKey();(groups[k]||(groups[k]=[])).push(p);}const out={};for(const k in groups){const plist=groups[k],best=plist.reduce((a,b)=>a.pbestCost<b.pbestCost?a:b);out[k]=best.pbest;}return out;}
function boidsForce(p){
  if(!state.boids.on)return{x:0,y:0};let sep={x:0,y:0},ali={x:0,y:0},coh={x:0,y:0};let n=0;
  for(const q of state.particles){if(q===p||q.evacuated)continue;const d=dist(p.pos,q.pos);if(d>0&&d<state.boids.radius){n++;sep.x+=(p.pos.x-q.pos.x)/d;sep.y+=(p.pos.y-q.pos.y)/d;ali.x+=q.vel.x;ali.y+=q.vel.y;coh.x+=q.pos.x;coh.y+=q.pos.y;}}
  if(n===0)return{x:0,y:0};sep.x/=n;sep.y/=n;ali.x/=n;ali.y/=n;coh.x/=n;coh.y/=n;
  const sepL=Math.hypot(sep.x,sep.y);if(sepL>0){sep.x=sep.x/sepL*state.boids.radius/60;sep.y=sep.y/sepL*state.boids.radius/60;}
  const aliDesired={x:ali.x-p.vel.x,y:ali.y-p.vel.y};const aliL=Math.hypot(aliDesired.x,aliDesired.y);if(aliL>0){aliDesired.x=aliDesired.x/aliL*state.pso.maxV/3;aliDesired.y=aliDesired.y/aliL*state.pso.maxV/3;}
  const cohDesired={x:coh.x-p.pos.x,y:coh.y-p.pos.y};const cohL=Math.hypot(cohDesired.x,cohDesired.y);if(cohL>0){cohDesired.x=cohDesired.x/cohL*state.boids.radius/60;cohDesired.y=cohDesired.y/cohL*state.boids.radius/60;}
  if(state.showBoids)boidsVis.push({pos:{x:p.pos.x,y:p.pos.y},links:boidsNeighbors(p),steer:{x:sep.x*state.boids.sep+aliDesired.x*state.boids.ali+cohDesired.x*state.boids.coh,y:sep.y*state.boids.sep+aliDesired.y*state.boids.ali+cohDesired.y*state.boids.coh}});
  return{x:sep.x*state.boids.sep+aliDesired.x*state.boids.ali+cohDesired.x*state.boids.coh,y:sep.y*state.boids.sep+aliDesired.y*state.boids.ali+cohDesired.y*state.boids.coh};
}
let boidsVis=[];
function boidsNeighbors(p){const out=[];for(const q of state.particles){if(q===p||q.evacuated)continue;if(dist(p.pos,q.pos)<state.boids.radius)out.push(q.pos);}return out;}
function wallAvoidForce(p){if(!state.wallAvoid)return{x:0,y:0};let ax=0,ay=0;
  for(const w of state.walls){let d,dx=0,dy=0;
    if(w.w&&w.h){d=rectDist(w,p.pos);const cx=Math.max(w.x,Math.min(p.pos.x,w.x+w.w)),cy=Math.max(w.y,Math.min(p.pos.y,w.y+w.h));dx=p.pos.x-cx;dy=p.pos.y-cy;}
    else{d=segDistToPoint(w.x1,w.y1,w.x2,w.y2,p.pos.x,p.pos.y);const nx=w.x2-w.x1,ny=w.y2-w.y1,L=Math.hypot(nx,ny);const px=-ny/L,py=nx/L;const side=px*(p.pos.x-w.x1)+py*(p.pos.y-w.y1);const sign=side>=0?1:-1;dx=sign*px;dy=sign*py;}
    if(d>0&&d<RADIUS*5){const f=(RADIUS*5-d)/(RADIUS*5);ax+=dx*f*state.wallRepel;ay+=dy*f*state.wallRepel;}}
  return{x:ax,y:ay};
}
function psoStep(iters){
  boidsVis=[];
  for(const p of state.particles){if(!p.evacuated&&p.targetKind==='nearest'&&!p.targetObj)p.targetObj=p.targetRect();}
  const gb=groupBests();
  for(let it=0;it<iters;it++){
    for(const p of state.particles){if(p.evacuated)continue;
      const g=gb[p.groupKey()]||p.pos;const r1=Math.random(),r2=Math.random();
      p.vel.x=p.vel.x*state.pso.w+(p.pbest.x-p.pos.x)*state.pso.c1*r1+(g.x-p.pos.x)*state.pso.c2*r2;
      p.vel.y=p.vel.y*state.pso.w+(p.pbest.y-p.pos.y)*state.pso.c1*r1+(g.y-p.pos.y)*state.pso.c2*r2;
      const bf=boidsForce(p);p.vel.x+=bf.x;p.vel.y+=bf.y;
      const wf=wallAvoidForce(p);p.vel.x+=wf.x;p.vel.y+=wf.y;
      // stuck recovery: if nearly stationary but not yet evacuated, nudge toward target.
      // add tangential jitter so particles blocked by a wall slide around it, not into it.
      if(Math.hypot(p.vel.x,p.vel.y)<1.5){const tp=p.targetPos(),tdx=tp.x-p.pos.x,tdy=tp.y-p.pos.y,td=Math.hypot(tdx,tdy);
        if(td>0.5){const s=p._stuckJit||(p._stuckJit=(Math.random()<0.5?-1:1));p.vel.x+=tdx/td*2.5+(-tdy/td)*3*s;p.vel.y+=tdy/td*2.5+(tdx/td)*3*s;}}
      const L=Math.hypot(p.vel.x,p.vel.y);if(L>state.pso.maxV){p.vel.x*=state.pso.maxV/L;p.vel.y*=state.pso.maxV/L;}
      let nx=p.pos.x+p.vel.x,ny=p.pos.y+p.vel.y;pushOutOfWalls({x:nx,y:ny},state.walls,p.radius);
      nx=clamp(nx,p.radius,CANVAS_W-p.radius);ny=clamp(ny,p.radius,CANVAS_H-p.radius);
      p.pos={x:nx,y:ny};const c=p.cost();if(c<p.pbestCost){p.pbestCost=c;p.pbest={x:nx,y:ny};}
      const tr=p.targetRect();if(tr&&rectDist(tr,p.pos)<=p.radius)p.evacuated=true;}
    state.iter++;}
}

function objectAt(px,py){const p={x:px,y:py};
  for(let i=state.particles.length-1;i>=0;i--){if(dist(state.particles[i].pos,p)<=state.particles[i].radius+5)return state.particles[i];}
  for(const arr of [state.safes,state.exits,state.walls])for(let i=arr.length-1;i>=0;i--){
    const o=arr[i];if(o.w&&o.h){if(rectContains(o,p))return o;}else{if(segDistToPoint(o.x1,o.y1,o.x2,o.y2,px,py)<=8)return o;}}
  return null;}
function handleAt(o,px,py,tol=8){
  if(!o)return null;
  if(o.w&&o.h){const corners={nw:[o.x,o.y],ne:[o.x+o.w,o.y],sw:[o.x,o.y+o.h],se:[o.x+o.w,o.y+o.h]};
    for(const k in corners){const c=corners[k];if(Math.hypot(px-c[0],py-c[1])<=tol)return k;}
    if(Math.abs(px-o.x)<=tol&&py>=o.y-tol&&py<=o.y+o.h+tol)return'w';if(Math.abs(px-(o.x+o.w))<=tol&&py>=o.y-tol&&py<=o.y+o.h+tol)return'e';

      if(d.kind==='exit')state.exits.push(r);else state.safes.push(r);setStatus(`${d.kind.charAt(0).toUpperCase()+d.kind.slice(1)} drawn.`);}}
  state.drag=null;redraw();});

window.addEventListener('keydown',e=>{const tag=(e.target&&e.target.tagName)||'';const typing=tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA';
  if(!typing&&(e.key==='Delete'||e.key==='Backspace')){deleteSelected();}
  if(e.key===' '&&state.mode==='sim'&&!typing){e.preventDefault();toggleRun();}
  if(typing)return;
  const toolKeys={'1':'select','2':'wall','3':'exit','4':'safe','5':'particle','6':'target','7':'delete'};
  if(toolKeys[e.key]){setTool(toolKeys[e.key]);return;}
  if(e.key==='v'||e.key==='V'){state.showVel=!state.showVel;redraw();}
  if(e.key==='p'||e.key==='P'){state.showPbest=!state.showPbest;redraw();}
  if(e.key==='g'||e.key==='G'){state.showGbest=!state.showGbest;redraw();}
  if(e.key==='b'||e.key==='B'){state.showBoids=!state.showBoids;redraw();}});
function toggleRun(){if(state.mode!=='sim'){setMode('sim');return;}if(!state.particles.length){setStatus('No particles.');return;}if(!state.exits.length&&!state.safes.length){setStatus('No exits or safe zones.');return;}
  state.running=!state.running;document.getElementById('btnRun').textContent=state.running?'⏸ Pause':'▶ Run';setStatus(state.running?'Running…':'Paused.');if(state.running)runFrame();}
function stepSim(){if(state.mode!=='sim')setMode('sim');if(!state.particles.length){setStatus('No particles.');return;}if(!state.exits.length&&!state.safes.length){setStatus('No exits or safe zones.');return;}
  psoStep(state.pso.iters);document.getElementById('statIter').textContent=state.iter;document.getElementById('statEvac').textContent=state.particles.filter(p=>p.evacuated).length;setStatus(`Stepped ${state.pso.iters} iter(s).`);redraw();const ev=state.particles.filter(p=>p.evacuated).length;if(ev===state.particles.length)setStatus('All particles evacuated!');}
function resetSim(){state.running=false;document.getElementById('btnRun').textContent='▶ Run';state.iter=0;
  for(const p of state.particles){p.evacuated=false;p.pbest={x:p.pos.x,y:p.pos.y};p.pbestCost=Infinity;if(p.targetKind==='nearest')p.targetObj=null;}
  document.getElementById('statIter').textContent='0';document.getElementById('statEvac').textContent='0';setStatus('Sim reset.');redraw();}
function runFrame(){if(!state.running)return;if(!state.particles.length){state.running=false;document.getElementById('btnRun').textContent='▶ Run';return;}
  psoStep(state.pso.iters);document.getElementById('statIter').textContent=state.iter;document.getElementById('statEvac').textContent=state.particles.filter(p=>p.evacuated).length;redraw();
  if(state.particles.filter(p=>p.evacuated).length===state.particles.length){state.running=false;document.getElementById('btnRun').textContent='▶ Run';setStatus('All particles evacuated!');return;}
  state.animId=requestAnimationFrame(runFrame);}

window.app={setMode,setTool,addParticles,applyPso,applyBoids,toggleRun,stepSim,resetSim,saveMap,loadMap,clearMap,demoLayout,deleteSelected,changeSelType,applySelTarget,applySelTransform,applySelSize,redraw};
document.addEventListener('DOMContentLoaded',()=>{app.setMode('edit');app.setTool('select');app.redraw();document.getElementById('status').textContent='Ready — use tools 1–7: drag to draw walls, exits, safe zones; place particles; then Simulate.';document.getElementById('statusText').textContent=document.getElementById('status').textContent;});
</script>
</body>
</html>
